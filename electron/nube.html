<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Servidor en la nube</title>
<style>
  :root { --bg:#15151d; --surface2:#1d1d29; --text:#f5f5f8; --muted:#a2a2b6; --danger:#ff5c6c; }
  * { box-sizing: border-box; }
  body { margin:0; padding:26px 28px; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,"Segoe UI",sans-serif; }
  h1 { margin:0 0 6px; font-size:21px; }
  p { margin:0 0 14px; color:var(--muted); }
  input { width:100%; height:46px; padding:0 14px; border:0; border-radius:12px; background:var(--surface2); color:var(--text); font:inherit; outline:none; box-shadow:inset 0 0 0 1px rgba(255,255,255,.1); }
  input:focus { box-shadow: inset 0 0 0 1.5px #ff6a3d; }
  .row { display:flex; gap:10px; margin-top:16px; }
  button { flex:1; height:44px; border:0; border-radius:999px; font:700 15px system-ui; cursor:pointer; color:var(--text); background:var(--surface2); }
  button.main { background:linear-gradient(135deg,#ff8a3d,#ff3d81); color:#1c0a06; }
  button[disabled] { opacity:.6; }
  .err { color:var(--danger); min-height:20px; margin-top:10px; font-size:14px; }
  small { color:var(--muted); display:block; margin-top:14px; }
</style>
</head>
<body>
  <h1>Servidor en la nube</h1>
  <p>Escribe la dirección de tu servidor Sonora. Esta app se conectará a él en vez de usar el servidor de esta computadora, y tu música estará disponible aunque la PC esté apagada.</p>
  <input id="url" placeholder="https://sonora-abcd.onrender.com" autocomplete="off" spellcheck="false">
  <div class="err" id="err" role="alert"></div>
  <div class="row">
    <button id="local" type="button">Usar esta PC</button>
    <button id="ok" type="button" class="main">Guardar y reiniciar</button>
  </div>
  <small>«Usar esta PC» vuelve al modo anterior (servidor local). La app se reinicia sola al guardar.</small>
<script>
  var $ = function (id) { return document.getElementById(id); };
  var actual = new URLSearchParams(location.search).get('actual') || '';
  $('url').value = actual;
  function enviar(valor) {
    $('err').textContent = '';
    $('ok').disabled = $('local').disabled = true;
    $('ok').textContent = 'Conectando…';
    window.nube.guardar(valor).then(function (r) {
      if (r && r.ok) { $('ok').textContent = 'Reiniciando…'; return; }
      $('ok').disabled = $('local').disabled = false;
      $('ok').textContent = 'Guardar y reiniciar';
      $('err').textContent = (r && r.error) || 'No se pudo guardar.';
    });
  }
  $('ok').onclick = function () {
    if (!$('url').value.trim()) { $('err').textContent = 'Escribe la dirección de tu servidor.'; return; }
    enviar($('url').value);
  };
  $('local').onclick = function () { enviar(''); };
  $('url').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('ok').click(); if (e.key === 'Escape') window.nube.cerrar(); });
  $('url').focus();
</script>
</body>
</html>
