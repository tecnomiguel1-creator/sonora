<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090d">
<title>Sonora</title>
<style>html,body{margin:0;height:100%;background:#09090d}</style>
</head>
<body>
<script>
// Cargador de la pantalla de Sonora dentro de la app del celular.
//  1) Con conexión: baja la pantalla más reciente de tu servidor (así los cambios llegan sin reinstalar el APK).
//  2) Sin conexión: usa la última que bajó.
//  3) Si nunca pudo bajar ninguna: usa la copia que viene dentro del APK (index.html).
(function () {
  'use strict';
  var KEY = 'sonora.ui';
  function ls(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  var base = ls('sonora.server').replace(/\/+$/, '');
  var params = new URLSearchParams(location.search);
  if (params.has('reset')) { try { localStorage.removeItem(KEY); } catch (e) {} }
  var stored = null;
  try { stored = JSON.parse(ls(KEY) || 'null'); } catch (e) {}
  if (stored && !(stored.files && stored.files['index.html'] && stored.files['app.js'])) stored = null;

  function fallback() { location.replace('index.html'); }

  // Sin servidor (modo "solo en este celular"): las pantallas nuevas se bajan del repositorio de GitHub.
  var GH = 'tecnomiguel1-creator/sonora';
  var FILES = ['index.html', 'styles.css', 'offline.js', 'audio-fx.js', 'local.js', 'app.js'];
  function timed(url, ms, opts, asText) {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, ms);
    opts = opts || {}; opts.signal = ctrl.signal; opts.cache = 'no-store';
    return fetch(url, opts).then(function (r) { clearTimeout(timer); if (!r.ok) throw new Error('http'); return r.text(); });
  }
  function fetchGithub(ms) {
    return timed('https://api.github.com/repos/' + GH + '/commits/main', ms, { headers: { Accept: 'application/vnd.github.sha' } }).then(function (sha) {
      sha = sha.trim();
      if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('sha');
      if (stored && stored.version === sha) return stored;
      return Promise.all(FILES.map(function (f) { return timed('https://raw.githubusercontent.com/' + GH + '/' + sha + '/public/' + f, 10000); })).then(function (texts) {
        var files = {};
        FILES.forEach(function (f, i) { files[f] = texts[i]; });
        return { version: sha, files: files };
      });
    });
  }
  function save(b) { try { localStorage.setItem(KEY, JSON.stringify(b)); } catch (e) {} }
  function blobUrl(text, type) { return URL.createObjectURL(new Blob([text], { type: type })); }

  function fetchBundle(ms) {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, ms);
    return fetch(base + '/ui-bundle.json', { cache: 'no-store', signal: ctrl.signal })
      .then(function (r) { clearTimeout(timer); if (!r.ok) throw new Error('http'); return r.json(); })
      .then(function (b) {
        if (!b || !b.files || !b.files['index.html'] || !b.files['app.js'] || !b.files['styles.css'] || !b.files['offline.js']) throw new Error('formato');
        return b;
      });
  }

  function run(b) {
    var f = b.files;
    var css = blobUrl(f['styles.css'], 'text/css');
    var off = blobUrl(f['offline.js'], 'text/javascript');
    var app = blobUrl(f['app.js'], 'text/javascript');
    var loc = f['local.js'] ? blobUrl(f['local.js'], 'text/javascript') : '';
    var fx = f['audio-fx.js'] ? blobUrl(f['audio-fx.js'], 'text/javascript') : '';
    var html = f['index.html']
      .replace(/<link rel="manifest"[^>]*>\s*/g, '')
      .replace('href="/styles.css"', 'href="' + css + '"')
      .replace('<script src="/offline.js"><\/script>', '<script src="bundle-config.js"><\/script>\n<script src="' + off + '"><\/script>')
      .replace('<script src="/audio-fx.js"><\/script>', fx ? '<script src="' + fx + '"><\/script>' : '')
      .replace('<script src="/local.js"><\/script>', loc ? '<script src="' + loc + '"><\/script>' : '')
      .replace('<script type="module" src="/app.js"><\/script>', '<script type="module" src="' + app + '"><\/script>')
      .replace(/(href|src)="\/(?!\/)/g, '$1="');
    document.open();
    document.write(html);
    document.close();
  }

  var latest = base ? fetchBundle : ls('sonora.local') === '1' ? fetchGithub : null;
  if (!latest || params.has('copia')) return fallback();

  if (stored) {
    // Ya hay una pantalla guardada: se usa enseguida, y si el servidor tiene una más nueva se usa esa.
    if (navigator.onLine === false) return run(stored);
    var settled = false;
    latest(2000).then(
      function (b) {
        if (settled) return;
        settled = true;
        if (b.version !== stored.version) { save(b); run(b); } else run(stored);
      },
      function () { if (!settled) { settled = true; run(stored); } }
    );
  } else {
    latest(6000).then(function (b) { save(b); run(b); }, fallback);
  }
})();
</script>
</body>
</html>
