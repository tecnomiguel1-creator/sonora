# Compila el APK de Sonora en la nube (GitHub Actions), sin instalar Android Studio.
# Uso: sube este proyecto a un repositorio de GitHub -> pestaña "Actions" -> "Compilar APK" -> "Run workflow".
# Al terminar (unos 5-8 minutos), descarga el archivo "sonora-apk" desde la página de la ejecución.
name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['android-app/**', 'public/**', '.github/workflows/build-apk.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # El Android SDK ya viene instalado en ubuntu-latest; solo aceptamos las licencias.
      - name: Preparar Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Instalar dependencias y sincronizar
        run: |
          npm install
          node scripts/bundle-ui.mjs
          npx cap sync android

      - name: Compilar APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: sonora-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Deja el APK como archivo público: https://github.com/<usuario>/<repo>/releases/download/apk/Sonora.apk
      - name: Publicar el APK en Releases
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk Sonora.apk
          gh release view apk >/dev/null 2>&1 || gh release create apk --prerelease --title "Sonora para Android (APK)" --notes "Descarga Sonora.apk e instálalo en el celular." --target "${{ github.sha }}"
          gh release upload apk Sonora.apk --clobber
